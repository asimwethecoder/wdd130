<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Co.</title>
    <meta name="description"
      content="Contact White Water Rafting Co. for questions, trip reservations, or inquiries about our river rafting adventures.">
    <meta name="author" content="Derrick Asimwe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-oars-logo.png" alt="White Water Rafting Co. logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Co.</h1>
            <p>123 Main River Street<br>Kolob, California<br>+1 999 999 9999<br>info@whitewater.com</p>
        </section>

        <section class="contact-grid">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.223594830113!2d-122.41941548468205!3d37.7749295797591!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c6c8f4459%3A0xb10ed6d9b5050fa5!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1610000000000!5m2!1sen!2sus" width="100%" height="350" allowfullscreen="" loading="lazy"></iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="user-name">Name</label>
                    <input type="text" id="user-name" name="user-name" placeholder="Enter your name" required>
                </div>

                <div class="form-item">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" name="user-email" placeholder="Enter your email" required>
                </div>

                <fieldset class="form-item radio-group">
                    <legend>Message Purpose</legend>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked> General Inquiry
                    </label>
                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question
                    </label>
                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Profile of Suzan Smith, Lead River Guide">
                    <figcaption>Suzan Smith<br><span>Lead River Guide</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Profile of John Smith, Safety Director">
                    <figcaption>John Smith<br><span>Safety Director</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Profile of Alex Pedro, Office Manager">
                    <figcaption>Alex Pedro<br><span>Office Manager</span></figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 White Water Rafting Co. | Derrick Asimwe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
